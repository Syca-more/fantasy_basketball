<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Game Picker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>🏀 Random <span>Game</span> Picker</h1>
      <p>Choose players by position and pull a random game from each log.</p>
    </header>

    <div class="controls">
      <div class="fields" id="fields"></div>
    </div>

    <div id="result">
      <div class="message">Select players and press Submit.</div>
    </div>

    <footer class="bar">
      <div id="summary"></div>
      <button id="beastBtn" class="beast">Release the Beast</button>
    </footer>
  </div>

  <div id="timmy" class="timmy" hidden>
    <img src="timmy.png" alt="Timmy" onerror="this.style.display='none'">
    <div class="timmy-text">Timmy Unlocked!!!</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
