<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Game Picker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f97316;
      --accent-hover: #fb923c;
      --win: #22c55e;
      --loss: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
      padding: 2rem 1rem;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { margin: 0; font-size: 2rem; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { margin: 0.4rem 0 0; color: var(--muted); }

    .controls {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    input, button {
      font-size: 1rem;
      font-family: inherit;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    input {
      width: 100%;
      background: var(--bg);
      color: var(--text);
    }
    input::placeholder { color: var(--muted); }
    input:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .actions { margin-top: 1.25rem; text-align: center; }

    button {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-color: var(--accent);
      cursor: pointer;
      padding: 0.7rem 2.5rem;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.97); }

    #result { margin-top: 1.5rem; display: grid; gap: 1rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .card h2 { margin: 0 0 1rem; font-size: 1.3rem; }
    .card h2 .pos { color: var(--accent); }
    .card h2 small { color: var(--muted); font-weight: 400; font-size: 0.9rem; margin-left: 0.5rem; }

    .wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--card-border); }

    table { border-collapse: collapse; width: 100%; white-space: nowrap; }
    th, td { padding: 0.6rem 0.8rem; text-align: center; }
    th {
      background: #0b1220;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td { font-size: 1rem; background: var(--bg); }

    .key { color: var(--accent); font-weight: 700; font-size: 1.15rem; }
    th.key { font-size: 0.75rem; }
    .win { color: var(--win); font-weight: 700; }
    .loss { color: var(--loss); font-weight: 700; }

    .message { text-align: center; color: var(--muted); padding: 1rem; }
    .error { color: var(--loss); }

    @media (max-width: 520px) {
      header h1 { font-size: 1.6rem; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏀 Random <span>Game</span> Picker</h1>
      <p>Choose players by position and pull a random game from each log.</p>
    </header>

    <div class="controls">
      <div class="fields" id="fields"></div>
      <div class="actions"><button id="submitBtn">Submit</button></div>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // WHICH PLAYERS APPEAR IN WHICH DROPDOWN. Edit these lists to add players.
    // Each player needs a matching file, e.g. "Ty Lawson" -> ty_lawson.xls
    const POSITIONS = {
      "Point Guard":    ["Ty Lawson"],
      "Shooting Guard": [],
      "Small Forward":  [],
      "Power Forward":  [],
      "Center":         []
    };

    const FILE_EXT = ".xls";
    const FILE_FOLDER = "";   // use "data/" if you put the files in a data folder

    const COLUMNS = ["Date", "Opp", "Result", "MP", "FG", "FGA", "FG%", "3P", "3PA",
      "3P%", "eFG%", "FT", "FTA", "FT%", "ORB", "DRB", "TRB", "AST", "STL",
      "BLK", "TOV", "PF", "PTS", "GmSc", "+/-"];
    const KEY_COLUMNS = ["TRB", "AST", "PTS"];   // highlighted in orange

    const fieldsEl = document.getElementById("fields");
    const result = document.getElementById("result");
    const cache = {};   // so each file is only downloaded once
    const inputs = {};  // position -> its input element

    // Build one searchable dropdown per position
    Object.entries(POSITIONS).forEach(([position, players], i) => {
      const listId = "list-" + i;
      const field = document.createElement("div");
      field.className = "field";

      const label = document.createElement("label");
      label.htmlFor = "input-" + i;
      label.textContent = position;

      const input = document.createElement("input");
      input.id = "input-" + i;
      input.setAttribute("list", listId);
      input.placeholder = "Select Player";
      input.autocomplete = "off";

      const datalist = document.createElement("datalist");
      datalist.id = listId;
      players.forEach(p => datalist.appendChild(new Option(p)));

      field.append(label, input, datalist);
      fieldsEl.appendChild(field);
      inputs[position] = input;
    });

    function fileFor(name) {
      const slug = name.toLowerCase().trim()
        .replace(/[^a-z0-9\s]/g, "")
        .replace(/\s+/g, "_");
      return FILE_FOLDER + slug + FILE_EXT;
    }

    async function loadRows(name) {
      if (cache[name]) return cache[name];
      const url = fileFor(name);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Could not find ${url} (HTTP ${res.status})`);
      const wb = XLSX.read(await res.arrayBuffer(), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
      cache[name] = rows;
      return rows;
    }

    function cellClass(col, value) {
      if (KEY_COLUMNS.includes(col)) return "key";
      if (col === "Result") {
        if (String(value).trim().startsWith("W")) return "win";
        if (String(value).trim().startsWith("L")) return "loss";
      }
      return "";
    }

    function errorCard(position, text) {
      return `<div class="card"><h2><span class="pos">${position}</span></h2>
              <div class="message error">${text}</div></div>`;
    }

    async function buildCard(position, typed) {
      // Only accept names that are in this position's list (case-insensitive)
      const name = POSITIONS[position].find(p => p.toLowerCase() === typed.toLowerCase());
      if (!name) return errorCard(position, `"${typed}" isn't available at this position. Pick a name from the list.`);

      try {
        const rows = await loadRows(name);
        if (!rows.length) throw new Error("That file has no data rows.");
        const row = rows[Math.floor(Math.random() * rows.length)];

        const head = COLUMNS
          .map(c => `<th class="${KEY_COLUMNS.includes(c) ? "key" : ""}">${c}</th>`)
          .join("");
        const cells = COLUMNS
          .map(c => `<td class="${cellClass(c, row[c])}">${row[c] ?? ""}</td>`)
          .join("");

        return `
          <div class="card">
            <h2><span class="pos">${position}:</span> ${name}
              <small>${row["Date"] ?? ""} ${row["Opp"] ? "vs " + row["Opp"] : ""}</small></h2>
            <div class="wrap"><table><tr>${head}</tr><tr>${cells}</tr></table></div>
          </div>`;
      } catch (err) {
        return errorCard(position, err.message);
      }
    }

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const chosen = Object.keys(POSITIONS)
        .map(pos => [pos, inputs[pos].value.trim()])
        .filter(([, typed]) => typed !== "");

      if (!chosen.length) {
        result.innerHTML = `<div class="message">Select at least one player first.</div>`;
        return;
      }

      result.innerHTML = `<div class="message">Loading...</div>`;
      const cards = await Promise.all(chosen.map(([pos, typed]) => buildCard(pos, typed)));
      result.innerHTML = cards.join("");
    });
  </script>
</body>
</html>
