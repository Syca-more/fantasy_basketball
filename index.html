<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Game Picker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f97316;
      --accent-hover: #fb923c;
      --win: #22c55e;
      --loss: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
      background-attachment: fixed;
      color: var(--text);
    }

    /* One-screen layout: header, controls, results (fills the middle), footer bar */
    .app {
      height: 100vh;
      height: 100dvh;
      max-width: 1500px;
      margin: 0 auto;
      padding: 0.7rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    header { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.4rem; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { margin: 0; color: var(--muted); font-size: 0.85rem; }

    .controls {
      position: relative;
      z-index: 30;   /* so open dropdown lists sit above the result cards */
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(5, 1fr) auto;
      gap: 0.75rem;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    input, button {
      font-size: 0.95rem;
      font-family: inherit;
      padding: 0.5rem 0.75rem;
      border-radius: 9px;
      border: 1px solid var(--card-border);
    }

    input {
      width: 100%;
      background: var(--bg);
      color: var(--text);
    }
    input::placeholder { color: var(--muted); }
    input:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Custom searchable dropdown */
    .combo { position: relative; }
    .combo input { padding-right: 2rem; cursor: pointer; }
    .combo .arrow {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .options {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 20;
      margin: 0;
      padding: 4px;
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .options[hidden] { display: none; }
    .options li {
      padding: 0.5rem 0.75rem;
      border-radius: 7px;
      cursor: pointer;
    }
    .options li.active { background: rgba(249, 115, 22, 0.25); }
    .options li.selected { color: var(--accent); font-weight: 700; }
    .options li.empty { color: var(--muted); cursor: default; font-style: italic; }

    button {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-color: var(--accent);
      cursor: pointer;
      padding: 0.5rem 1.6rem;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.97); }

    /* Results fill whatever space is left */
    #result {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .card {
      flex: 0 1 auto;
      min-height: 0;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }
    .card h2 { margin: 0 0 0.3rem; font-size: 0.95rem; }
    .card h2 .pos { color: var(--accent); }
    .card h2 small { color: var(--muted); font-weight: 400; font-size: 0.8rem; margin-left: 0.5rem; }

    .gmsc {
      color: var(--win);
      font-weight: 700;
      font-size: 0.9rem;
      margin-left: 0.6rem;
    }

    .wrap { border-radius: 8px; border: 1px solid var(--card-border); overflow: hidden; }

    table {
      border-collapse: collapse;
      width: 100%;
      white-space: nowrap;
      /* scales with window size so all 25 columns stay visible */
      font-size: clamp(0.55rem, min(0.85vw, 1.55vh), 0.85rem);
    }
    th, td { padding: 0.2rem 0.3rem; text-align: center; }
    th {
      background: #0b1220;
      color: var(--muted);
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    td { background: var(--bg); }

    .key { color: var(--accent); font-weight: 700; }
    td.key { font-size: 1.1em; }
    .win { color: var(--win); font-weight: 700; }
    .loss { color: var(--loss); font-weight: 700; }

    .message { text-align: center; color: var(--muted); padding: 1rem; margin: auto; }
    .error { color: var(--loss); }

    /* Bottom bar: summary on the left, Release the Beast on the right */
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      min-height: 3rem;
    }
    #summary { flex: 1; }

    .summary {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      background: var(--card);
      border: 1px solid var(--win);
      border-radius: 10px;
      padding: 0.4rem 1rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }
    .summary .label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .summary .sub { color: var(--muted); font-size: 0.75rem; }
    .summary .total { color: var(--win); font-size: 1.7rem; font-weight: 800; line-height: 1; }

    .beast {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-color: #ef4444;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.6rem 1.4rem;
      white-space: nowrap;
    }
    .beast:hover {
      background: linear-gradient(135deg, #f87171, #dc2626);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
    }

    /* Timmy popup: covers most of the screen */
    .timmy {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2vh;
      padding: 2vh 2vw;
      background: rgba(15, 23, 42, 0.95);
      text-align: center;
      animation: pop 0.3s ease-out;
    }
    .timmy[hidden] { display: none; }
    .timmy img {
      max-width: 92vw;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(249, 115, 22, 0.5);
    }
    .timmy-text {
      font-size: clamp(2rem, 9vw, 7rem);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(249, 115, 22, 0.6);
      line-height: 1.1;
    }
    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Wide screens: lock the page to one screen, no scrolling */
    @media (min-width: 900px) {
      body { overflow: hidden; }
    }

    /* Narrow screens (phones): 25 columns can't fit, so fall back to normal scrolling */
    @media (max-width: 899px) {
      .app { height: auto; min-height: 100vh; }
      .fields { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
      .wrap { overflow-x: auto; }
      table { font-size: 0.8rem; }
      .bar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🏀 Random <span>Game</span> Picker</h1>
      <p>Choose players by position and pull a random game from each log.</p>
    </header>

    <div class="controls">
      <div class="fields" id="fields"></div>
    </div>

    <div id="result">
      <div class="message">Select players and press Submit.</div>
    </div>

    <footer class="bar">
      <div id="summary"></div>
      <button id="beastBtn" class="beast">Release the Beast</button>
    </footer>
  </div>

  <div id="timmy" class="timmy" hidden>
    <img src="timmy.png" alt="Timmy" onerror="this.style.display='none'">
    <div class="timmy-text">Timmy Unlocked!!!</div>
  </div>

  <script>
    // WHICH PLAYERS APPEAR IN WHICH DROPDOWN. Edit these lists to add players.
    // Each player needs a matching file, e.g. "Ty Lawson" -> ty_lawson.xls
    const POSITIONS = {
      "Point Guard":    ["Ty Lawson","Fat Lever","Jamal Murray"],
      "Shooting Guard": ["David Thompson","Ralph Simpson","Allen Iverson"],
      "Small Forward":  ["Alex English","Carmelo Anthony","Kiki Vandeweghe"],
      "Power Forward":  ["Antonio McDyess","LaPhonso Ellis","Spencer Haywood"],
      "Center":         ["Nikola Jokic", "Dan Issel", "Dikembe Mutombo"]
    };

    // Hidden until "Release the Beast" is pressed
    const SECRET_PLAYER = "Tim Duncan";
    const SECRET_POSITION = "Power Forward";

    const FILE_EXT = ".xls";
    const FILE_FOLDER = "";   // use "data/" if you put the files in a data folder

    const COLUMNS = ["Date", "Opp", "Result", "MP", "FG", "FGA", "FG%", "3P", "3PA",
      "3P%", "eFG%", "FT", "FTA", "FT%", "ORB", "DRB", "TRB", "AST", "STL",
      "BLK", "TOV", "PF", "PTS", "GmSc", "+/-"];
    const KEY_COLUMNS = ["TRB", "AST", "PTS"];   // highlighted in orange

    const fieldsEl = document.getElementById("fields");
    const result = document.getElementById("result");
    const summaryEl = document.getElementById("summary");
    const timmyEl = document.getElementById("timmy");
    const cache = {};    // so each file is only downloaded once
    const combos = {};   // position -> its dropdown

    // Searchable dropdown: click shows ALL options, typing filters them
    function createCombo(players, id) {
      const wrap = document.createElement("div");
      wrap.className = "combo";

      const input = document.createElement("input");
      input.id = id;
      input.type = "text";
      input.placeholder = "Select Player";
      input.autocomplete = "off";

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "▾";

      const list = document.createElement("ul");
      list.className = "options";
      list.hidden = true;

      wrap.append(input, arrow, list);

      let selected = "";   // last valid choice
      let shown = [];      // options currently visible
      let active = -1;     // keyboard-highlighted index

      function render(filter) {
        const q = filter.trim().toLowerCase();
        shown = q ? players.filter(p => p.toLowerCase().includes(q)) : players.slice();
        active = -1;
        list.innerHTML = "";
        if (!shown.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = players.length ? "No matches" : "No players added yet";
          list.appendChild(li);
          return;
        }
        shown.forEach(p => {
          const li = document.createElement("li");
          li.textContent = p;
          if (p === selected) li.classList.add("selected");
          // mousedown (not click) so it fires before the input loses focus
          li.addEventListener("mousedown", e => { e.preventDefault(); choose(p); });
          list.appendChild(li);
        });
      }

      function setActive(i) {
        const items = list.querySelectorAll("li:not(.empty)");
        items.forEach(li => li.classList.remove("active"));
        active = i;
        if (items[i]) {
          items[i].classList.add("active");
          items[i].scrollIntoView({ block: "nearest" });
        }
      }

      function openAll() { render(""); list.hidden = false; }
      function close() { list.hidden = true; }
      function choose(p) { selected = p; input.value = p; close(); input.blur(); }

      input.addEventListener("focus", () => { input.select(); openAll(); });
      input.addEventListener("click", () => { if (list.hidden) openAll(); });
      input.addEventListener("input", () => { render(input.value); list.hidden = false; });

      input.addEventListener("blur", () => {
        const typed = input.value.trim();
        const exact = players.find(p => p.toLowerCase() === typed.toLowerCase());
        if (exact) selected = exact;       // typed a full valid name
        else if (typed === "") selected = "";   // cleared the box
        input.value = selected;            // otherwise revert to last valid choice
        close();
      });

      input.addEventListener("keydown", e => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (list.hidden) openAll();
          if (shown.length) setActive(Math.min(active + 1, shown.length - 1));
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (shown.length) setActive(Math.max(active - 1, 0));
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (!list.hidden) {
            if (active >= 0) choose(shown[active]);
            else if (shown.length === 1) choose(shown[0]);
          }
        } else if (e.key === "Escape") {
          input.value = selected;
          close();
        }
      });

      return { el: wrap, getValue: () => selected };
    }

    // Build one dropdown per position
    Object.entries(POSITIONS).forEach(([position, players], i) => {
      const field = document.createElement("div");
      field.className = "field";

      const label = document.createElement("label");
      label.htmlFor = "input-" + i;
      label.textContent = position;

      // Passing the array itself (not a copy) lets us add a player to it later
      const combo = createCombo(players, "input-" + i);
      field.append(label, combo.el);
      fieldsEl.appendChild(field);
      combos[position] = combo;
    });

    // Submit button lives in the same row as the dropdowns
    const submitBtn = document.createElement("button");
    submitBtn.id = "submitBtn";
    submitBtn.textContent = "Submit";
    fieldsEl.appendChild(submitBtn);

    function fileFor(name) {
      const slug = name.toLowerCase().trim()
        .replace(/[^a-z0-9\s]/g, "")
        .replace(/\s+/g, "_");
      return FILE_FOLDER + slug + FILE_EXT;
    }

    async function loadRows(name) {
      if (cache[name]) return cache[name];
      const url = fileFor(name);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Could not find ${url} (HTTP ${res.status})`);
      const wb = XLSX.read(await res.arrayBuffer(), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const all = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });

      // Only rows with a value in MP can be picked (skips Did Not Play / Inactive
      // rows, and repeated header rows where the MP cell just says "MP")
      const rows = all.filter(r => {
        const mp = String(r["MP"] ?? "").trim();
        return mp !== "" && mp !== "MP";
      });

      cache[name] = rows;
      return rows;
    }

    function cellClass(col, value) {
      if (KEY_COLUMNS.includes(col)) return "key";
      if (col === "Result") {
        if (String(value).trim().startsWith("W")) return "win";
        if (String(value).trim().startsWith("L")) return "loss";
      }
      return "";
    }

    function errorCard(position, text) {
      return `<div class="card"><h2><span class="pos">${position}</span></h2>
              <div class="message error">${text}</div></div>`;
    }

    async function buildCard(position, name) {
      try {
        const rows = await loadRows(name);
        if (!rows.length) throw new Error("That file has no rows with minutes played (MP).");
        const row = rows[Math.floor(Math.random() * rows.length)];

        // Pull GmSc out as a number (null if missing or not a number)
        const parsed = parseFloat(String(row["GmSc"] ?? "").replace(/[^0-9.\-]/g, ""));
        const gmsc = isNaN(parsed) ? null : parsed;

        const head = COLUMNS
          .map(c => `<th class="${KEY_COLUMNS.includes(c) ? "key" : ""}">${c}</th>`)
          .join("");
        const cells = COLUMNS
          .map(c => `<td class="${cellClass(c, row[c])}">${row[c] ?? ""}</td>`)
          .join("");

        const html = `
          <div class="card">
            <h2><span class="pos">${position}:</span> ${name}
              <small>${row["Date"] ?? ""} ${row["Opp"] ? "vs " + row["Opp"] : ""}</small>
              ${gmsc !== null ? `<span class="gmsc">GmSc ${row["GmSc"]}</span>` : ""}</h2>
            <div class="wrap"><table><tr>${head}</tr><tr>${cells}</tr></table></div>
          </div>`;
        return { html, gmsc };
      } catch (err) {
        return { html: errorCard(position, err.message), gmsc: null };
      }
    }

    submitBtn.addEventListener("click", async () => {
      const chosen = Object.keys(POSITIONS)
        .map(pos => [pos, combos[pos].getValue()])
        .filter(([, name]) => name !== "");

      summaryEl.innerHTML = "";

      if (!chosen.length) {
        result.innerHTML = `<div class="message">Select at least one player first.</div>`;
        return;
      }

      result.innerHTML = `<div class="message">Loading...</div>`;
      const built = await Promise.all(chosen.map(([pos, name]) => buildCard(pos, name)));

      const scores = built.map(b => b.gmsc).filter(g => g !== null);
      const total = scores.reduce((sum, g) => sum + g, 0);

      result.innerHTML = built.map(b => b.html).join("");

      if (scores.length) {
        summaryEl.innerHTML = `
          <div class="summary">
            <div>
              <div class="label">Total Game Score</div>
              <div class="sub">Sum of GmSc across ${scores.length} player${scores.length === 1 ? "" : "s"}</div>
            </div>
            <div class="total">${total.toFixed(1)}</div>
          </div>`;
      }
    });

    // Release the Beast: show Timmy for 3 seconds and unlock Tim Duncan
    new Image().src = "timmy.png";   // preload so it appears instantly
    let timmyTimer;
    document.getElementById("beastBtn").addEventListener("click", () => {
      const list = POSITIONS[SECRET_POSITION];
      if (!list.includes(SECRET_PLAYER)) list.push(SECRET_PLAYER);

      timmyEl.hidden = false;
      clearTimeout(timmyTimer);
      timmyTimer = setTimeout(() => { timmyEl.hidden = true; }, 3000);
    });
  </script>
</body>
</html>
